<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <title>${title}</title>

  <link rel="preload" as="image" href="${asset_base}brand/hero-muted-20261014.webp" fetchpriority="high">
  <link rel="stylesheet" href="${asset_base}site.css?v=${asset_version}">

  <link rel="stylesheet" href="${asset_base}page-flow.css?v=${asset_version}">
  <link rel="stylesheet" href="${asset_base}news.css?v=${asset_version}">
  <link rel="icon" href="${asset_base}brand/ai-law-frontier.jpg" type="image/jpeg">
  <script src="${asset_base}hero-liquid.js?v=${asset_version}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">跳转至正文</a>
<header class="site-header"><nav class="nav shell" aria-label="主导航">

</nav></header>
<main id="main">${content}${community_feedback}</main>
