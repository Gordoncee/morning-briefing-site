name: Morning briefing

on:
  schedule:
    # Beijing 07:30, 07:45, 08:05, 08:20, 08:35. Backups are idempotent.
    - cron: "30 23 * * *"
    - cron: "45 23 * * *"
    - cron: "5 0 * * *"
    - cron: "20 0 * * *"
    - cron: "35 0 * * *"
    # Afternoon catch-up, Beijing 13:15 and 16:15; reuse an existing daily MD.
    - cron: "15 5 * * *"
    - cron: "15 8 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "site/**", "archive/**", "ops/**", ".github/workflows/morning-briefing.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD; empty uses today in Beijing"
        required: false
        type: string
      provider:
        description: "Model provider"
        required: false
        default: "qwen"
        type: choice
        options: [qwen, kimi, openai, custom]
      model:
        description: "Model override"
        required: false
        default: "qwen3.8-max"
        type: string
      force:
        description: "Explicitly regenerate an already archived date (calls the model)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  archive-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      MODEL_PROVIDER: ${{ inputs.provider || vars.MODEL_PROVIDER || 'qwen' }}
      MODEL_NAME: ${{ inputs.model || vars.MODEL_NAME || '' }}
      BRIEFING_DATE: ${{ inputs.date || '' }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
      KIMI_MODEL: ${{ vars.KIMI_MODEL || 'kimi-k2.6' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.1' }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen3.8-max' }}
      MAX_NEWS_CANDIDATES: ${{ vars.MAX_NEWS_CANDIDATES || '30' }}
      FORCE_REGENERATE: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test cloud archive and static rendering
        run: python -m unittest discover -s tests -v
      - name: Collect original RSS and generate missing briefing
        id: generate
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ "$FORCE_REGENERATE" = "true" ]; then
            python scripts/generate_morning_briefing.py --force
          else
            python scripts/generate_morning_briefing.py
          fi
      - name: Record failure without API response or credentials
        if: steps.generate.outcome == 'failure'
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          stamp = os.environ.get('BRIEFING_DATE') or dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).date().isoformat()
          stamp = dt.date.fromisoformat(stamp).isoformat()
          path = Path('archive/runs') / stamp[:4] / stamp[5:7] / (stamp + '.md')
          path.parent.mkdir(parents=True, exist_ok=True)
          status = {'date': stamp, 'outcome': 'generation-or-validation-failed',
                    'rss_archive_retained': True, 'last_good_briefing_retained': True}
          path.write_text('# 采集生成状态 · ' + stamp + '\n\n```json\n' + json.dumps(status, ensure_ascii=False, separators=(',', ':')) + '\n```\n', encoding='utf-8')
          PY
      - name: Persist Markdown even if the model fails
        id: persist
        if: always() && !cancelled() && steps.generate.outcome != 'skipped'
        run: |
          git add archive data/briefings.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive daily news and original RSS"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain a recovery artifact
        if: always() && !cancelled() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-markdown-${{ github.run_id }}
          path: archive/
          retention-days: 7
      - name: Build only the public static site
        id: build
        if: always() && !cancelled() && steps.persist.outcome == 'success'
        run: python scripts/build_news_site.py
      - name: Configure Pages
        id: pages
        if: always() && !cancelled() && steps.build.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        id: upload
        if: always() && !cancelled() && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy GitHub Pages explicitly
        id: deployment
        continue-on-error: true
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Verify repository content on GitHub Pages and fazhi.cc
        id: verify
        continue-on-error: true
        timeout-minutes: 10
        if: always() && !cancelled() && steps.upload.outcome == 'success'
        run: python scripts/verify_news_sync.py --report sync-report.json
      - name: Republish existing artifact when web synchronization fails
        id: redeployment
        continue-on-error: true
        if: always() && !cancelled() && steps.verify.outcome == 'failure' && steps.generate.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Verify the repaired publication
        id: verify_retry
        continue-on-error: true
        timeout-minutes: 10
        if: always() && !cancelled() && (steps.redeployment.outcome == 'success' || steps.redeployment.outcome == 'failure')
        run: python scripts/verify_news_sync.py --report sync-report-retry.json
      - name: Retain public synchronization evidence
        if: always() && !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: news-sync-check-${{ github.run_id }}
          path: sync-report*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report a still-unsynchronized website
        if: always() && !cancelled() && steps.verify.outcome == 'failure' && steps.verify_retry.outcome != 'success'
        run: exit 1
      - name: Report generation failure after preserving archives and last good site
        if: steps.generate.outcome == 'failure'
        run: exit 1
